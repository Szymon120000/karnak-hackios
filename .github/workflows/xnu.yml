name: xnu-board

# The full kernel build still needs macOS + an Apple KDK (the `kernel` job is
# manual).  The host jobs prove that the board constants are self-consistent
# and that the board patch series still applies to the pinned XNU tag.

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: "Run the macOS kernel build (not wired up yet)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "xnu/**"
      - "tools/apply_xnu_patches.py"
      - "scripts/stage_xnu.sh"
      - "platform/edk2/XnuLoaderPkg/**"
      - ".github/workflows/xnu.yml"

jobs:
  board-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run board header test
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
              -I xnu/overlay/pexpert \
              xnu/tests/board_static_test.c \
              -o /tmp/board_static_test
          /tmp/board_static_test

      - name: Compile and run early console tests
        run: |
          # The polled UART driver is compiled for the host with a simulated
          # 16550 (KARNAK_EARLY_HOST_TEST), so its register access, CRLF
          # translation and stuck-transmitter bail-out are actually exercised.
          gcc -std=c11 -Wall -Wextra -Werror -DKARNAK_EARLY_HOST_TEST \
              -I xnu/overlay/pexpert \
              xnu/tests/karnak_early_test.c \
              xnu/overlay/pexpert/arm64/karnak_early.c \
              -o /tmp/karnak_early_test
          /tmp/karnak_early_test

      - name: Compile and run Mach-O parser tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
              -I xnu/tests/hostshim \
              -I platform/edk2/XnuLoaderPkg/Include \
              xnu/tests/xnu_image_test.c \
              platform/edk2/XnuLoaderPkg/Library/XnuImageLib/XnuImageLib.c \
              -o /tmp/xnu_image_test
          /tmp/xnu_image_test

      - name: Compile and run boot_args tests
        run: |
          # Verifies every field offset against Apple's xnu-8796 arm64 boot.h
          # (vendored in xnu/include) before it is used in firmware.
          gcc -std=gnu11 -Wall -Wextra -Werror \
              -I xnu/tests/hostshim \
              -I platform/edk2/XnuLoaderPkg/Include \
              -I xnu/include/pexpert \
              xnu/tests/boot_args_test.c \
              platform/edk2/XnuLoaderPkg/Library/KarnakBootArgsLib/KarnakBootArgsLib.c \
              -o /tmp/boot_args_test
          /tmp/boot_args_test

  patch-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned XNU and stage karnak support
        run: ./scripts/stage_xnu.sh

      - name: Verify the staged tree
        run: |
          set -e
          grep -q 'MACHINE_FLAGS_ARM64_KARNAK' vendor/xnu/makedefs/MakeInc.def
          grep -q 'ARM64_BOARD_CONFIG_KARNAK' vendor/xnu/pexpert/pexpert/arm64/board_config.h
          grep -q 'KARNAK_UART' vendor/xnu/pexpert/arm/pe_serial.c
          grep -q 'karnak_early.c' vendor/xnu/pexpert/conf/files.arm64
          grep -q 'karnak_gicv2_init_cpu' vendor/xnu/pexpert/arm/pe_fiq.c
          grep -q 'karnak_gicv2_ack' vendor/xnu/osfmk/arm64/sleh.c
          grep -q 'karnak_secondary_entry' vendor/xnu/osfmk/arm64/start.s
          grep -q 'karnak_cpu_signal_is_enabled' vendor/xnu/osfmk/arm64/cpu.c
          grep -q 'ml_is_boot_cpu' vendor/xnu/osfmk/arm64/machine_routines.c
          grep -q 'KarnakCPU.cpp' vendor/xnu/iokit/conf/files.arm64
          test -f vendor/xnu/pexpert/pexpert/arm64/KARNAK.h
          test -f vendor/xnu/pexpert/arm64/board_mt8163.c
          test -f vendor/xnu/iokit/Kernel/arm/KarnakCPU.cpp
          test -f vendor/xnu/iokit/Kernel/arm/KarnakPlatformExpert.cpp

      - name: Re-run the stage (must be idempotent)
        run: ./scripts/stage_xnu.sh

  kernel:
    runs-on: macos-14
    timeout-minutes: 120
    if: ${{ inputs.build_kernel == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Explain
        run: |
          echo "::warning::Kernel build is not wired up yet; see xnu/README.md"
          exit 1
