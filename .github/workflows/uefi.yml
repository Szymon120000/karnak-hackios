name: uefi

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "include/**"
      - "scripts/**"
      - "tools/**"
      - "build_uefi.sh"
      - ".github/workflows/uefi.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: uefi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build KarnakPkg UEFI + boot.img
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev nasm iasl \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            python3 python3-pip \
            git make

      - name: Cache edk2-mtk checkout
        uses: actions/cache@v4
        with:
          path: vendor/edk2-mtk
          key: edk2-mtk-v2-${{ runner.os }}-${{ hashFiles('scripts/fetch_deps.sh') }}

      - name: Fetch edk2-mtk
        run: ./scripts/fetch_deps.sh

      - name: Build firmware and boot image
        run: ./scripts/build_uefi.sh DEBUG

      - name: Diagnose GenFw crash
        if: failure()
        run: |
          sudo apt-get install -y -qq gdb
          BIN="$PWD/vendor/edk2-mtk/Common/edk2/BaseTools/Source/C/bin"
          file "$BIN/GenFw"
          "$BIN/GenFw" --version || true
          mkdir -p /tmp/gdbwrap
          cat > /tmp/gdbwrap/GenFw <<EOF
          #!/bin/sh
          exec gdb -batch -ex run -ex "bt full" --args "$BIN/GenFw" "\$@"
          EOF
          chmod +x /tmp/gdbwrap/GenFw
          MOD=vendor/edk2-mtk/Build/karnak/DEBUG_GCC5/AARCH64/MediaTekPkg/Drivers/LogoDxe/LogoDxe
          if [ -d "$MOD" ]; then
            cd "$MOD"
            make -f GNUmakefile OUTPUT/LogoDxehii.lib GENFW=/tmp/gdbwrap/GenFw 2>&1 | tail -40
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karnak-uefi
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: karnak-uefi-buildlogs
          path: |
            vendor/edk2-mtk/Build/karnak/**/*.log
            vendor/edk2-mtk/Build/karnak/**/BuildReport.log
          if-no-files-found: ignore
          retention-days: 7
